name: publish-v43
on:
  push:
    paths:
      - '.github/workflows/publish-v43.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch changed files
        run: |
          set -euo pipefail
          curl -fsSL -o index.html "https://aka.doubaocdn.com/s/ktITU2tBxL"
          curl -fsSL -o app.js "https://aka.doubaocdn.com/s/lDSSXPuFwc"
          test "$(wc -c < index.html)" -eq 8480
          test "$(wc -c < app.js)" -eq 78084
          grep -q 'MBTI 40型人格测试 · v43' index.html
          grep -q 'app.js?v=39' index.html
          grep -q 'v: 43' app.js
          grep -q '18:43:05' app.js
          grep -q 'NOTICE_MAX_VERSIONS' app.js
          grep -q '_loadPref' app.js
          node -e "new Function(require('fs').readFileSync('app.js','utf8'))"
      - name: Commit and remove helper
        run: |
          set -euo pipefail
          git config user.name "kwdaj"
          git config user.email "kwdaj@users.noreply.github.com"
          git rm .github/workflows/publish-v43.yml
          git add index.html app.js
          git commit -m "v43: 点任意位置即开播音乐、公告栏显示时分秒、公告只留 4 个版本"
          git push
