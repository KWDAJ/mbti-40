name: publish-v49
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch
        run: |
          exec 2>> "$GITHUB_WORKSPACE/publish-diag.txt"
          set -x
          echo "start $(date -u)" > "$GITHUB_WORKSPACE/publish-diag.txt"
          mkdir -p /tmp/dl
          B=https://aka.doubaocdn.com/s
          SPEC="index.html:8811:bN6LMM2U02 styles.css:47368:5MTX5WzcD4 app.js:84841:LKWIpOCwzp"
          err=0
          for t in $SPEC; do
            f=${t%%:*}
            rest=${t#*:}
            want=${rest%%:*}
            code=${rest#*:}
            curl -sSL --retry 2 -o "/tmp/dl/$f" "$B/$code"
            got=$(wc -c < "/tmp/dl/$f" 2>/dev/null | tr -d ' \t\n')
            echo "$f got=${got:-none} want=$want" >> "$GITHUB_WORKSPACE/publish-diag.txt"
            if [ "${got:-0}" != "$want" ]; then err=1; fi
          done
          echo "ERR=$err" | tee -a "$GITHUB_WORKSPACE/publish-diag.txt"
          echo "ERR=$err" >> "$GITHUB_ENV"
          if [ "$err" = "0" ]; then
            cp /tmp/dl/index.html index.html
            cp /tmp/dl/styles.css styles.css
            cp /tmp/dl/app.js app.js
            grep -q "· v49</title>" index.html && echo title-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=2
            grep -q "styles.css?v=33" index.html && echo css-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=2
            grep -q "app.js?v=44" index.html && echo app-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=2
            grep -q "__hiddenQCounts" app.js && echo hqc-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=2
            grep -q "renderResultMusicLine" app.js && echo rmline-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=2
            node -e "new Function(require('fs').readFileSync('app.js','utf8'))" && echo app-js-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=3
            echo "POST=$err" >> "$GITHUB_WORKSPACE/publish-diag.txt"
            echo "ERR=$err" >> "$GITHUB_ENV"
            if [ "$err" = "0" ]; then rm -f publish-diag.txt; fi
          fi

      - name: commit
        if: always()
        run: |
          git config user.name "doubao-bot"
          git config user.email "doubao-bot@users.noreply.github.com"
          git rm --quiet .github/workflows/publish-v49.yml || true
          if [ "${ERR:-1}" = "0" ] && [ ! -f publish-diag.txt ]; then
            git add index.html styles.css app.js
            git commit -m "v49：修断点续答阈值 + 结果页音乐状态文案 + 配乐加载兜底 + 手机端分享遮罩去模糊" || true
          else
            git add publish-diag.txt
            git commit -m "diag: 发布诊断" || true
          fi
          git push
