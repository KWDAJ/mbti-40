name: publish-v53
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch
        run: |
          exec 2>> "$GITHUB_WORKSPACE/publish-diag.txt"
          set -x
          echo "start $(date -u)" > "$GITHUB_WORKSPACE/publish-diag.txt"
          mkdir -p /tmp/dl
          B=https://aka.doubaocdn.com/s
          SPEC="index.html:8811:B9tMz3YUPu app.js:84885:7g2HKfpwGW"
          err=0
          for t in $SPEC; do
            f=${t%%:*}
            rest=${t#*:}
            want=${rest%%:*}
            code=${rest#*:}
            curl -sSL --retry 2 -o "/tmp/dl/$f" "$B/$code"
            got=$(wc -c < "/tmp/dl/$f" 2>/dev/null | tr -d ' \t\n')
            echo "$f got=${got:-none} want=$want" >> "$GITHUB_WORKSPACE/publish-diag.txt"
            if [ "${got:-0}" != "$want" ]; then err=1; fi
          done
          if [ "$err" = "0" ]; then
            cp /tmp/dl/index.html index.html
            cp /tmp/dl/app.js app.js
            grep -q "· v53</title>" index.html && echo title-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=2
            grep -q "app.js?v=48" index.html && echo app-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=2
            grep -q "total: 24, perDim: 4" app.js && echo lite24-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=2
            grep -q "_fadeIn" app.js && echo fade-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=2
            grep -q "openAdminPanel" app.js && err=4 && echo admin-still-there >> "$GITHUB_WORKSPACE/publish-diag.txt" || true
            node -e "new Function(require('fs').readFileSync('app.js','utf8'))" && echo app-js-ok >> "$GITHUB_WORKSPACE/publish-diag.txt" || err=3
          fi
          echo "ERR=$err" | tee -a "$GITHUB_WORKSPACE/publish-diag.txt"
          echo "ERR=$err" >> "$GITHUB_ENV"
          if [ "$err" = "0" ]; then rm -f publish-diag.txt; fi

      - name: commit
        if: always()
        run: |
          git config user.name "doubao-bot"
          git config user.email "doubao-bot@users.noreply.github.com"
          git rm --quiet .github/workflows/publish-v53.yml || true
          if [ "${ERR:-1}" = "0" ] && [ ! -f publish-diag.txt ]; then
            git add index.html app.js
            git commit -m "v53：精简 24 题（恢复九型）+ 专属曲淡入 + 清死代码" || true
          else
            git add publish-diag.txt
            git commit -m "diag: 发布诊断 v53" || true
          fi
          git push
