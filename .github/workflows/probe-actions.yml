name: probe-actions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: go
        run: |
          date -u > .actions-probe.txt
          echo "runner ok" >> .actions-probe.txt
          git config user.name "doubao-bot"
          git config user.email "doubao-bot@users.noreply.github.com"
          git rm --quiet .github/workflows/probe-actions.yml
          git add .actions-probe.txt
          git commit -m "probe: actions alive"
          git push
