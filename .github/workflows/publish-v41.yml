name: publish-v41
on:
  push:
    paths:
      - '.github/workflows/publish-v41.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch new site files
        run: |
          set -euo pipefail
          curl -fsSL -o index.html "https://aka.doubaocdn.com/s/5ghjLP1jjd"
          curl -fsSL -o styles.css "https://aka.doubaocdn.com/s/RpZDuI3HDQ"
          curl -fsSL -o app.js "https://aka.doubaocdn.com/s/7hp0CsURQU"
          curl -fsSL -o mbti-data.js "https://aka.doubaocdn.com/s/FPPxUf8oMC"
          test "$(wc -c < index.html)" -eq 8480
          test "$(wc -c < styles.css)" -eq 46301
          test "$(wc -c < app.js)" -eq 76032
          test "$(wc -c < mbti-data.js)" -eq 277296
          grep -q 'notice-board' index.html
          grep -q 'SITE_CHANGELOG' app.js
          grep -q 'v41' index.html
      - name: Commit and remove helper
        run: |
          set -euo pipefail
          git config user.name "kwdaj"
          git config user.email "kwdaj@users.noreply.github.com"
          git rm .github/workflows/publish-v41.yml
          git add index.html styles.css app.js mbti-data.js
          git commit -m "v41: 修复代号渲染/配色/文案/分享图/稀有型说明/隐藏维度/音乐按钮/弹层闪烁，新增更新公告栏"
          git push
