name: publish-v46
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download
        run: |
          set -e
          mkdir -p /tmp/dl
          curl -fsSL -o /tmp/dl/index.html      "https://aka.doubaocdn.com/s/qafCHGMOWv"
          curl -fsSL -o /tmp/dl/styles.css      "https://aka.doubaocdn.com/s/g2tWWpXum4"
          curl -fsSL -o /tmp/dl/app.js          "https://aka.doubaocdn.com/s/y1xvaXcYEm"
          curl -fsSL -o /tmp/dl/mbti-data.js    "https://aka.doubaocdn.com/s/KnwGUPkVfY"
          curl -fsSL -o /tmp/dl/esfj.mp3        "https://aka.doubaocdn.com/s/POZPBMwxYR"
          curl -fsSL -o /tmp/dl/esfp.mp3        "https://aka.doubaocdn.com/s/Qb7kgacD2L"
          curl -fsSL -o /tmp/dl/isfp.mp3        "https://aka.doubaocdn.com/s/uEzrT5VjZV"
          curl -fsSL -o /tmp/dl/istp.mp3        "https://aka.doubaocdn.com/s/S4zwrnOYmY"
          curl -fsSL -o /tmp/dl/hybrid_ei.mp3   "https://aka.doubaocdn.com/s/QSUVDkLm5r"
          curl -fsSL -o /tmp/dl/hybrid_sn.mp3   "https://aka.doubaocdn.com/s/4loTkgjEXV"
          curl -fsSL -o /tmp/dl/hybrid_tf.mp3   "https://aka.doubaocdn.com/s/zB349iMLbK"
          curl -fsSL -o /tmp/dl/hybrid_jp.mp3   "https://aka.doubaocdn.com/s/9bAgdMUngT"
          curl -fsSL -o /tmp/dl/hybrid_ei_sn.mp3 "https://aka.doubaocdn.com/s/FhLzIS8DHu"
          curl -fsSL -o /tmp/dl/hybrid_ei_tf.mp3 "https://aka.doubaocdn.com/s/V0ap4O9plA"
          curl -fsSL -o /tmp/dl/hybrid_ei_jp.mp3 "https://aka.doubaocdn.com/s/J7UVUGBSB0"
          curl -fsSL -o /tmp/dl/enmea_4.mp3     "https://aka.doubaocdn.com/s/OBv2BU1ohu"
          curl -fsSL -o /tmp/dl/enmea_9.mp3     "https://aka.doubaocdn.com/s/cnA4pM8BYS"

      - name: verify bytes
        run: |
          set -e
          chk() { got=$(wc -c < "$1"); if [ "$got" != "$2" ]; then echo "BAD $1 got=$got want=$2"; exit 1; fi; echo "ok $1 $got"; }
          chk /tmp/dl/index.html        8811
          chk /tmp/dl/styles.css        47207
          chk /tmp/dl/app.js            81594
          chk /tmp/dl/mbti-data.js      277294
          chk /tmp/dl/esfj.mp3          960931
          chk /tmp/dl/esfp.mp3          960931
          chk /tmp/dl/isfp.mp3          960931
          chk /tmp/dl/istp.mp3          960931
          chk /tmp/dl/hybrid_ei.mp3     960931
          chk /tmp/dl/hybrid_sn.mp3     960931
          chk /tmp/dl/hybrid_tf.mp3     960931
          chk /tmp/dl/hybrid_jp.mp3     960931
          chk /tmp/dl/hybrid_ei_sn.mp3  960931
          chk /tmp/dl/hybrid_ei_tf.mp3  960931
          chk /tmp/dl/hybrid_ei_jp.mp3  960931
          chk /tmp/dl/enmea_4.mp3       960931
          chk /tmp/dl/enmea_9.mp3       960931

      - name: install
        run: |
          set -e
          cp /tmp/dl/index.html   index.html
          cp /tmp/dl/styles.css   styles.css
          cp /tmp/dl/app.js       app.js
          cp /tmp/dl/mbti-data.js mbti-data.js
          mkdir -p music
          for f in esfj esfp isfp istp hybrid_ei hybrid_sn hybrid_tf hybrid_jp hybrid_ei_sn hybrid_ei_tf hybrid_ei_jp enmea_4 enmea_9; do
            cp "/tmp/dl/$f.mp3" "music/$f.mp3"
          done

      - name: verify content
        run: |
          set -e
          grep -q "· v46</title>" index.html
          grep -q "styles.css?v=32" index.html
          grep -q "app.js?v=42" index.html
          grep -q "mbti-data.js?v=25" index.html
          grep -q "startTest('lite')" index.html
          grep -q "精简" index.html
          grep -q "22 题" index.html
          grep -q "result-music" app.js
          grep -q "enterResult" app.js
          grep -q "MODE_CONFIG" app.js
          grep -q "music/enmea_9.mp3" app.js
          grep -q "music/hybrid_ei_jp.mp3" app.js
          node -e "new Function(require('fs').readFileSync('app.js','utf8')); console.log('app.js syntax ok')"
          node -e "new Function(require('fs').readFileSync('mbti-data.js','utf8')); console.log('data syntax ok')"

      - name: commit
        run: |
          set -e
          git config user.name "doubao-bot"
          git config user.email "doubao-bot@users.noreply.github.com"
          git rm --quiet .github/workflows/publish-v46.yml
          git add index.html styles.css app.js mbti-data.js music/esfj.mp3 music/esfp.mp3 music/isfp.mp3 music/istp.mp3 music/hybrid_ei.mp3 music/hybrid_sn.mp3 music/hybrid_tf.mp3 music/hybrid_jp.mp3 music/hybrid_ei_sn.mp3 music/hybrid_ei_tf.mp3 music/hybrid_ei_jp.mp3 music/enmea_4.mp3 music/enmea_9.mp3
          git commit -m "v46：新增精简 22 题模式 + 结果页专属配乐 + 补齐 13 首人格独家配乐"
          git push
